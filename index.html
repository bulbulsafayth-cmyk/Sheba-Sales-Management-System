<style>
:root{--navy:#14243a;--blue:#2563eb;--bg:#f3f6fb;--line:#e5eaf2;--muted:#64748b;--green:#0f9d72}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,system-ui,Segoe UI,Arial;color:#182338}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:600}button:disabled{opacity:.5;cursor:not-allowed}button.secondary{background:#eaf0fb;color:#23416f}button.danger{background:#feeceb;color:#b42318}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{background:#fff;padding:32px;border-radius:18px;box-shadow:0 12px 40px #1e35521a;width:min(420px,100%)}.login h1{margin:0 0 8px;font-size:24px}.muted{color:var(--muted)}label{display:block;font-size:12px;color:#536178;font-weight:650;margin:12px 0 6px}input,select{width:100%;padding:11px 12px;border:1px solid #d9e1ed;border-radius:9px;background:#fff;color:#182338;outline:none}input:focus,select:focus{border-color:#7ba5f8;box-shadow:0 0 0 3px #2563eb18}.login button{width:100%;margin-top:18px}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--navy);color:white;padding:22px 14px;flex-shrink:0}.brand{font-size:17px;font-weight:800;padding:6px 10px 24px;line-height:1.35}.brand small{display:block;color:#9eb0c8;font-size:11px;font-weight:500;margin-top:5px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;margin:3px 0;padding:11px 12px;font-weight:550}.nav button.active,.nav button:hover{background:#263b57;color:#fff}.main{flex:1;min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.content{padding:28px;max-width:1400px;margin:auto}.page-title{font-size:24px;font-weight:800;margin:0 0 5px}.sub{color:var(--muted);margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.card .k{color:var(--muted);font-size:12px}.card .v{font-size:26px;font-weight:800;margin-top:8px}.panel h3{margin:0 0 14px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.toolbar input{max-width:280px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#66758b;background:#f8fafd}td{font-size:13px}.actions{display:flex;gap:6px}.actions button{padding:6px 9px;font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.form-actions{display:flex;gap:8px;margin-top:16px}.notice{padding:11px 13px;border-radius:9px;margin:12px 0;background:#eff6ff;color:#1d4ed8}.error{background:#fff1f0;color:#b42318}.success{background:#ecfdf5;color:#087f5b}.empty{padding:25px;text-align:center;color:var(--muted)}.right{display:flex;gap:10px;align-items:center}.pill{font-size:11px;background:#edf4ff;color:#2454a6;border-radius:99px;padding:5px 9px}
textarea{width:100%;padding:11px 12px;border:1px solid #d9e1ed;border-radius:9px;font:inherit;outline:none;resize:vertical}textarea:focus{border-color:#7ba5f8;box-shadow:0 0 0 3px #2563eb18}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}.pager button{padding:6px 11px}
.items td{padding:6px}.items input,.items select{min-width:90px}.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.totals div{background:#f8fafd;border:1px solid var(--line);border-radius:10px;padding:10px}.totals b{display:block;font-size:16px;margin-top:4px}
@media(max-width:850px){.sidebar{width:190px}.cards{grid-template-columns:repeat(2,1fr)}.content{padding:18px}}
@media(max-width:620px){.app{display:block}.sidebar{width:100%;padding:12px}.brand{padding:4px 8px 12px}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;width:auto}.top{padding:0 16px}.content{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.totals{grid-template-columns:repeat(2,1fr)}}

/* daily sales sheet */
.sheetwrap{page:sheet}
@page sheet{size:A4 landscape;margin:0 9mm 9mm 9mm}
.sheet{background:#fff;color:#000;border:1px solid #cfd8e6;padding:12px;margin-bottom:22px;font-family:Calibri,Arial,sans-serif}
table.sh{width:100%;min-width:0;border-collapse:collapse;margin-bottom:8px}
table.sh th,table.sh td{padding:4px 6px;border:1px solid #000;white-space:normal;text-align:center;background:#fff;color:#000;font-size:11px;text-transform:none;letter-spacing:0}
table.sh.hd td{text-align:left;border:0;padding:2px 4px}
table.sh.hd td.co{font-size:26px;font-weight:800}
table.sh.hd td.ti{text-align:right;font-size:15px;font-weight:700;vertical-align:top}
table.sh.hd td.ad{font-weight:700;border-bottom:1px solid #000}
table.sh.sm th{text-align:left;font-weight:700;font-size:10px}
table.sh.sm td{text-align:left;font-weight:700;font-size:14px;padding:6px}
table.sh.mx th.l,table.sh.mx td.l{text-align:left}
table.sh.mx td.n{text-align:right}
table.sh.mx th.pc{min-width:34px}
table.sh.mx tr.gt td{font-weight:800;background:#f1f1f1}
@media print{.sheet{border:0;padding:0;margin:0;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}table.sh th,table.sh td{font-size:9px;padding:2px 3px}table.sh.hd td.co{font-size:22px}table.sh.sm td{font-size:12px}table.sh{margin-bottom:5px}table.sh thead{display:table-header-group}table.sh tr{break-inside:avoid;page-break-inside:avoid}}

/* ---- clean white sheet (screen + print) ---- */
.sheet{background:#fff;color:#000;border:1px solid #d5dce8;border-radius:10px;padding:16px}
table.sh{border:0}
table.sh.hd td.co{padding:0 4px 4px 0;line-height:0}
table.sh.hd td.co img.logo{height:86px;width:auto;display:block}
table.sh.hd td.ti{font-size:20px;font-weight:800;letter-spacing:.04em;color:#000;vertical-align:middle;text-align:right}
table.sh.hd td.ad{font-size:13px;font-weight:600;color:#000;border-bottom:1.5px solid #000;padding:7px 4px}
table.sh.sm{margin-top:12px;border-collapse:collapse;border:1.5px solid #000}
table.sh.sm th,table.sh.sm td{border:1px solid #000;background:#fff;color:#000}
table.sh.sm th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:7px 9px}
table.sh.sm td{font-size:18px;font-weight:800;padding:9px}
table.sh.mx{border-collapse:collapse;margin-top:12px}
table.sh.mx th,table.sh.mx td{border:1px solid #000;background:#fff;color:#000}
table.sh.mx thead th{font-size:12px;font-weight:700;padding:8px 5px;vertical-align:middle}
table.sh.mx td{font-size:13px;padding:9px 6px}
table.sh.mx tr.gt td{font-weight:800;border-top:2px solid #000;background:#fff}
.stitle{text-align:center;font-size:22px;font-weight:800;letter-spacing:.06em;margin:0 0 10px;color:#000}
.sheetfoot{display:flex;justify-content:space-between;gap:24px;margin-top:56px;font-size:12px;color:#000}
.sheetfoot div{flex:1;text-align:center}
.sheetfoot div span{display:block;border-top:1px solid #000;padding-top:5px;margin:0 16px}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet{border:0;border-radius:0;padding:0;zoom:var(--fit,1)}
  table.sh.hd td.co img.logo{height:24mm}
  table.sh.hd td.ti{font-size:18pt}
  table.sh.hd td.ad{font-size:11pt;padding:6px 4px}
  table.sh.sm th{font-size:8.5pt;padding:6px 8px}
  table.sh.sm td{font-size:15pt;padding:8px 9px}
  table.sh.mx thead th{font-size:9.5pt;padding:6px 4px}
  table.sh.mx td{font-size:11pt;padding:5px 5px}
  table.sh.mx.dense thead th{font-size:8pt;padding:6px 2px}
  table.sh.mx.dense td{font-size:9.5pt;padding:4px 3px}
  .sheetfoot{margin-top:40px;font-size:10pt;break-inside:avoid}
  .stitle{height:20mm;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3mm;font-size:21pt;font-weight:800;letter-spacing:.06em;text-align:center}
}
/* dashboard: today + month rows */
.dash-h{font-size:12px;font-weight:800;color:#23416f;text-transform:uppercase;letter-spacing:.06em;margin:4px 2px 10px;display:flex;align-items:center;gap:8px}
.dash-h:before{content:'';width:4px;height:16px;border-radius:2px;background:var(--blue)}
.dash-h{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 14px 7px 12px;box-shadow:0 2px 8px -4px #14243a55}
.cards5{grid-template-columns:repeat(5,minmax(0,1fr))}
.cards5 .card{border-top:3px solid #dbe5f5}
.cards5 .v{font-size:21px;word-break:break-word}
.cards5 .c-green{border-top-color:var(--green)}.cards5 .c-green .v{color:var(--green)}
.cards5 .c-red{border-top-color:#d92d20}.cards5 .c-red .v{color:#b42318}
@media(max-width:1100px){.cards5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.cards5{grid-template-columns:repeat(2,minmax(0,1fr))}}

.rtypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.rtypes button{padding:20px 12px;font-size:15px;background:#eaf0fb;color:#23416f}.rtypes button.on{background:var(--blue);color:#fff}
.blogo{width:auto;max-width:120px;object-fit:contain;border-radius:4px;vertical-align:middle;display:inline-block}
.btag{display:inline-flex;align-items:center;gap:8px}
.shbrand{display:inline-flex;align-items:center;gap:14px}
@media print{.blogo{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.hero{background:linear-gradient(120deg,#14243a,#2563eb);color:#fff;border-radius:16px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hero-h{font-size:22px;font-weight:800}.hero-s{opacity:.8;margin-top:4px;font-size:13px}
.hero-a{display:flex;gap:8px;flex-wrap:wrap}.hero-a button{background:#fff;color:#14243a}.hero-a button.ghost{background:#ffffff26;color:#fff}
.kcard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.kcard .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:800;flex-shrink:0;background:#eaf0fb;color:#2454a6}
.kcard .k{color:var(--muted);font-size:12px}.kcard .v{font-size:19px;font-weight:800;margin-top:3px;word-break:break-word}
.kc-green .ic{background:#e3f7ef;color:#0f9d72}.kc-green .v{color:#0f9d72}
.kc-red .ic{background:#feeceb;color:#b42318}.kc-red .v{color:#b42318}
.kc-amber .ic{background:#fff4dc;color:#b7791f}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:22px 0}
.bar-row{display:grid;grid-template-columns:170px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.bar-row:last-child{border-bottom:0}
.bar{height:9px;background:#eef2f8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:99px}
.bar-v{text-align:right;font-weight:700;font-size:13px;white-space:nowrap}.bar-v small{display:block;color:var(--muted);font-weight:500}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.chips span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:13px;color:var(--muted)}.chips b{color:#182338;margin-left:6px}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}.bar-row{grid-template-columns:120px 1fr auto}}
@media(max-width:620px){.hero{padding:16px}.hero-h{font-size:18px}}
/* brand tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{background:#eef3fb;color:#23416f;padding:8px 14px;border-radius:99px;font-weight:600}
.tabs button span{display:inline-block;margin-left:6px;background:#fff;color:#2454a6;border-radius:99px;padding:1px 8px;font-size:11px}
.tabs button.on{background:var(--blue);color:#fff}
.tabs button.on span{background:#ffffff33;color:#fff}

/* sales entry: three sections + sticky totals bar */
/* sales entry: fit on one screen */
.salesfit .sub{display:none}
.salesfit .prodtools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.salesfit .prodtools button{padding:6px 10px}
.content:has(.salesfit){padding-top:12px;padding-bottom:12px}
.salesfit .page-title{display:none}
.salesfit .panel.sec{padding:12px 14px;margin-bottom:10px}
.salesfit .sec-h{margin-bottom:4px;font-size:14px}
.salesfit .totals.sticky{margin-bottom:10px;padding:6px}
.salesfit .items td{padding:3px 6px}
.salesfit .itemscroll{max-height:calc(100vh - 430px);min-height:150px;overflow:auto}
.salesfit .itemscroll thead th{position:sticky;top:0;background:#fff;z-index:2}
.recvgrid{align-items:end}.recvgrid .saverow{display:flex;gap:8px;padding-bottom:1px}.recvgrid .saverow button{width:100%}
@media(min-width:1000px){.salesfit .secdet .form-grid{grid-template-columns:repeat(6,minmax(0,1fr))}.recvgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pinbanner{position:sticky;top:0;z-index:60;background:#fff7e0;border-bottom:2px solid #f5b301;padding:8px 28px;display:flex;flex-direction:column;gap:6px}
.pinbanner .pr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:15px}.pinbanner .pn{font-size:28px;font-weight:800;letter-spacing:.3em;background:#fff;border:1px solid #f5b301;border-radius:8px;padding:2px 14px;color:#14243a}.pinbanner small{color:#8a6a00}
@media(max-width:620px){.pinbanner{padding:8px 12px}}
.mgrid td{padding:3px 4px}.mgrid input,.mgrid select{min-width:110px}.mgrid td:first-child{width:28px}
.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:800;margin-bottom:12px;color:#14243a}
.sec-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;flex-shrink:0}
.totals.sticky{position:sticky;top:0;z-index:20;margin:0 0 16px;grid-template-columns:repeat(5,minmax(0,1fr));padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 16px -10px #1e355260}
.totals.sticky div{background:#fff}
@media(max-width:620px){.totals.sticky{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:6px}.totals.sticky div{padding:5px 4px;min-width:0}.totals.sticky b{font-size:11px;letter-spacing:-.02em;}.totals.sticky span{font-size:9px}}


/* sunny day background */
html{min-height:100%}
body{background:
radial-gradient(circle at 90% 9%,#fffef0 0,#fff3b0 4%,rgba(255,226,120,.75) 8%,rgba(255,214,90,.28) 18%,rgba(255,214,90,0) 34%),
radial-gradient(ellipse 300px 62px at 16% 20%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),
radial-gradient(ellipse 220px 48px at 24% 23%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),
radial-gradient(ellipse 340px 70px at 58% 14%,rgba(255,255,255,.9),rgba(255,255,255,0) 70%),
radial-gradient(ellipse 240px 52px at 66% 17%,rgba(255,255,255,.8),rgba(255,255,255,0) 70%),
radial-gradient(ellipse 320px 66px at 38% 52%,rgba(255,255,255,.7),rgba(255,255,255,0) 70%),
radial-gradient(ellipse 380px 70px at 82% 62%,rgba(255,255,255,.65),rgba(255,255,255,0) 70%),
linear-gradient(180deg,#4aa8ee 0,#80c6f6 40%,#bfe4fa 75%,#e4f5ff 100%);
background-attachment:fixed;background-color:#8ccaf5}
.main{background:transparent}
.page-title{color:#0b2a4a}.sub{color:#17375e}
.top{background:rgba(255,255,255,.92)}
.login{background:rgba(255,255,255,.96)}
@media print{body{background:#fff!important}}

/* floating phones: two layers of phone outlines drift slowly in different directions */
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;background-image:var(--phones);background-repeat:repeat;will-change:transform}
body::before{inset:-420px;background-size:420px 420px;animation:phDrift 90s linear infinite}
body::after{inset:-300px;background-size:300px 300px;opacity:.5;animation:phDrift2 120s linear infinite}
@keyframes phDrift{from{transform:translate(0,0)}to{transform:translate(420px,420px)}}
@keyframes phDrift2{from{transform:translate(0,0)}to{transform:translate(-300px,300px)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
@media print{body::before,body::after{display:none!important}}
/* report type buttons: blue fill, white text (selected one is darker) */
.rtypes button{background:#2563eb;color:#fff;border-color:#1e40af}
.rtypes button:hover{background:#1d4ed8;color:#fff}
.rtypes button.on{background:#1e3a8a;color:#fff;border-color:#172554}
.mprice{font-size:12px;color:var(--muted);font-weight:600;margin-top:1px}
/* credit & cheque report */
@page cr{size:A4 landscape;margin:8mm}
.crsheet{background:#fff;color:#000;border:1px solid #cfd8e6;border-radius:10px;overflow:auto;page:cr;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.crsheet .cr-title{text-align:center;font-weight:800;font-size:28px;padding:8px 10px;line-height:1.15}
.crsheet .cr-cheque{background:#ff0000;color:#fff}
.crsheet .cr-credit{background:#b7dee8;color:#000;border-bottom:2px solid #000}
.crsheet .cr-date{background:#f79646;text-align:center;font-weight:800;font-size:22px;padding:4px}
.crsheet .cr-road{font-weight:800;font-size:21px;padding:4px 10px;border:1px solid #000;margin-top:12px}
.crsheet:has(.cr-cheque) .cr-road{background:#92d050;text-align:center}
.crsheet:has(.cr-credit) .cr-road{background:#ffc000;display:inline-block;min-width:240px;margin-left:0}
table.crt{border-collapse:collapse;width:100%;min-width:0;table-layout:fixed}
table.crt th,table.crt td{border:1px solid #000;padding:5px 4px;white-space:normal;overflow-wrap:anywhere;text-align:center;font-size:12px;background:#fff;color:#e00000;font-weight:700;text-transform:none;letter-spacing:0;vertical-align:middle}
table.crt tr.cr-h th{color:#000;font-weight:800;background:#fff;font-size:12px}
.crsheet:has(.cr-credit) table.crt tr.cr-h th{background:#bfbfbf}
table.crt td.l{text-align:left}
table.crt td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
table.crt tr.crsum td{color:#000;font-weight:800;background:#f1f1f1}
.crsheet:has(.cr-cheque) table.crt tr.crsum td{background:#ffff00}
.crsheet:has(.cr-credit) table.crt tr.crsum td{background:#ffc000}
table.crt tr.cr-offrow td,table.crt tr.cr-grand td{color:#000;font-weight:800;font-size:13px;background:#92d050}
.crsheet:has(.cr-credit) table.crt tr.cr-grand td{background:#b7dee8;font-size:14px}
table.crt tr.crdone td{color:#6b7280;text-decoration:line-through}
table.crt td.cract{text-decoration:none}
#crLandBox{position:fixed;inset:0;z-index:9999;background:#0b1220;overflow:hidden}
#crLandBox .crl-wrap{position:absolute;left:0;top:0;display:flex;flex-direction:column;background:#fff}
#crLandBox .crl-bar{display:flex;gap:8px;padding:6px 8px;background:#0b1220;flex:none}
#crLandBox .crl-bar button{width:auto;padding:6px 12px}
#crLandBox .crl-body{flex:1;overflow:auto;padding:6px;-webkit-overflow-scrolling:touch}
#crLandBox .noprint{display:none!important}
#crLandBox .crsheet{border-radius:0;border:0}
@media print{#crLandBox{display:none!important}}
table.crt td.cract button{display:block;width:100%;margin:0 0 3px;padding:3px 4px;font-size:11px}
.crsheet .cr-credit-foot{display:none}
@media print{.crsheet{border:0;border-radius:0;overflow:visible}.crsheet .cr-credit-foot{display:block;text-align:center;font-size:9pt;font-weight:600;margin-top:8px;color:#000}table.crt th,table.crt td{font-size:10px;padding:3px 4px}.crsheet .cr-title{font-size:22px}.crsheet .cr-date{font-size:16px}.crsheet .cr-road{font-size:15px}}

let userMode='admin',currentDso=null,currentPage='dashboard',navToken=0;

/* ---------- data helpers (FIX 10: no more silent 1000-row cap, counts instead of loading everything) ---------- */
async function fetchAll(build){const size=1000;let out=[],from=0;for(;;){const {data,error}=await build().range(from,from+size-1);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<size)break;from+=size}return out}
const queryAll=table=>fetchAll(()=>db.from(table).select('*').order('created_at',{ascending:false}).order('id'));
async function count(table){const {count,error}=await db.from(table).select('id',{count:'exact',head:true});if(error)throw error;return count||0}
/* FIX 7: DSO users only ever see their own sales */
function scopedReport(){let q=db.from('sales_report').select('*');if(userMode==='dso'&&currentDso)q=q.eq('dso_id',currentDso.id);return q}

const brandKey=n=>{const t=String(n||'').toLowerCase();return Object.keys(BRAND_LOGOS).find(k=>t.includes(k))||''};
const brandLogo=(n,h)=>{const k=brandKey(n);return k?`<img class="blogo" style="height:${h||22}px" src="${BRAND_LOGOS[k]}" alt="${esc(n)}">`:''};
const brandTag=(n,h)=>{const l=brandLogo(n,h);return l?`<span class="btag" title="${esc(n)}">${l}</span>`:esc(n)};

/* ---------- login / session ---------- */
const getProfile=uid=>db.from('profiles').select('*').eq('user_id',uid).maybeSingle();
const DSO_COLS='id,full_name,brand_id,road_id';
/* a DSO can work for several brands and several roads: dso_brands / dso_roads hold one row per DSO+item (they fall back to dsos.brand_id / dsos.road_id until the SQL is run) */
async function loadDsoLinkMap(t,c){try{const r=await fetchAll(()=>db.from(t).select('*').order('dso_id'));const m={};r.forEach(x=>{(m[x.dso_id]=m[x.dso_id]||[]).push(x[c])});return m}catch(e){return {}}}
const loadDsoBrandMap=()=>loadDsoLinkMap('dso_brands','brand_id'),loadDsoRoadMap=()=>loadDsoLinkMap('dso_roads','road_id');
async function dsoLinkIds(d,t,c){const {data,error}=await db.from(t).select(c).eq('dso_id',d.id);if(error||!data||!data.length)return d[c]?[d[c]]:[];return data.map(x=>x[c])}
const dsoBrandIds=d=>dsoLinkIds(d,'dso_brands','brand_id'),dsoRoadIds=d=>dsoLinkIds(d,'dso_roads','road_id');
const dsoIds=(x,map,col)=>{col=col||'brand_id';return (map&&map[x.id]&&map[x.id].length)?map[x.id]:(x[col]?[x[col]]:[])};
const MULTI={brand_id:{lk:'brands',map:'_dsoBrandMap',table:'dso_brands'},road_id:{lk:'roads',map:'_dsoRoadMap',table:'dso_roads'}};
async function showDsoPicker(){
  const {data:dsos,error}=await db.from('dsos').select(DSO_COLS).eq('is_active',true).order('full_name');
  if(error){await db.auth.signOut();$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');return msg($('loginMsg'),'Could not load DSO list: '+error.message)}
  if(!dsos?.length){await db.auth.signOut();return msg($('loginMsg'),'No active DSO found. Please ask Admin to add a DSO.')}
  $('dsoSelect').innerHTML=dsos.map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('');
  window._availableDsos=dsos;$('loginType').value='dso';
  $('appView').classList.add('hidden');$('loginView').classList.remove('hidden');
  $('authFields').classList.add('hidden');$('dsoStep').classList.remove('hidden');$('loginMsg').innerHTML='';
}
async function enterDso(d){d.brandIds=await dsoBrandIds(d);d.roadIds=await dsoRoadIds(d);currentDso=d;store.set('dsoId',d.id);
  showApp('dso')}
async function useDso(id){const {data}=await db.from('dsos').select(DSO_COLS).eq('id',id).eq('is_active',true).maybeSingle();if(!data)return false;await enterDso(data);return true}
/* FIX 2: DSO sessions are restored on refresh too */
async function checkSession(){
  const {data:{session}}=await db.auth.getSession();if(!session)return;
  const {data:p,error}=await getProfile(session.user.id);
  if(error||!p){await db.auth.signOut();return}
  if(p.role==='admin')return showApp('admin');
  if(p.role==='dso'){const id=p.dso_id||store.get('dsoId');if(id&&await useDso(id))return;return showDsoPicker()}
  await db.auth.signOut();
}
$('loginType').onchange=()=>{$('loginMsg').innerHTML='';$('dsoStep').classList.add('hidden');$('authFields').classList.remove('hidden')};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('loginBtn').onclick=async()=>{
  userMode=$('loginType').value;
  const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  if(error)return msg($('loginMsg'),error.message);
  const prof=await getProfile(data.user.id);
  if(prof.error){await db.auth.signOut();return msg($('loginMsg'),'Profile check failed: '+prof.error.message)}
  if(!prof.data){await db.auth.signOut();return msg($('loginMsg'),'No profile found for this account. Ask Admin to create its profile.')}
  if(userMode==='admin'){
    if(prof.data.role!=='admin'){await db.auth.signOut();return msg($('loginMsg'),'This account is not an Admin account.')}
    showApp('admin');
  }else{
    if(prof.data.role!=='dso'){await db.auth.signOut();return msg($('loginMsg'),'This account is not a DSO account.')}
    if(prof.data.dso_id&&await useDso(prof.data.dso_id))return;
    await showDsoPicker();
  }
};
$('dsoContinueBtn').onclick=async()=>{
  const d=(window._availableDsos||[]).find(x=>x.id===$('dsoSelect').value);
  if(!d)return msg($('loginMsg'),'Please select your DSO name.');
  await enterDso(d);
};
$('backLoginBtn').onclick=async()=>{await db.auth.signOut();store.del('dsoId');store.del('loggedDso');$('dsoStep').classList.add('hidden');$('authFields').classList.remove('hidden');$('loginMsg').innerHTML=''};
$('logoutBtn').onclick=async()=>{stopLocTracking();currentDso=null;store.del('dsoId');store.del('loggedDso');await db.auth.signOut();$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('dsoStep').classList.add('hidden');$('authFields').classList.remove('hidden');$('loginMsg').innerHTML=''};
const DSO_PAGES=['dashboard','sales','reports','sheet','credit'];
function showApp(mode='admin'){
  userMode=mode;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');
  if(!window._bfNames){window._bfNames=1;addBrandNames()}
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('hidden',mode==='dso'&&!DSO_PAGES.includes(b.dataset.page)));
  $('sessionLabel').textContent=mode==='dso'?'DSO: '+(currentDso?.full_name||''):'Admin session';
  go(mode==='dso'?'sales':'dashboard');
  if(mode==='dso')startLocTracking();else stopLocTracking();
}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
const titles={dashboard:'Dashboard',brands:'Brand Management',roads:'Road Management',dsos:'DSO Management',retailers:'Retailer Management',products:'Product Management',sales:'Sales Entry',reports:'Sales Reports',sheet:'Daily Sales Sheet',credit:'Credit & Cheque Report',opening:'Opening Balance',dsoloc:'DSO Location'};
const pages={dashboard:()=>dashboard(),brands:()=>crudPage('brands'),roads:()=>crudPage('roads'),dsos:()=>crudPage('dsos'),retailers:()=>crudPage('retailers'),products:()=>productsPage(),sales:a=>salesPage(a),reports:()=>reportsPage(),sheet:()=>sheetPage(),credit:()=>creditPage(),opening:()=>openingPage(),dsoloc:()=>dsoLocPage()};
function go(p,arg){
  if(userMode==='dso'&&!DSO_PAGES.includes(p))p='sales';
  currentPage=p;navToken++;
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===((p==='sheet'||p==='credit')?'reports':p)));
  $('topTitle').textContent=titles[p];
  Promise.resolve(pages[p](arg)).catch(e=>{$('page').innerHTML=`<div class="notice error">${esc(e.message||e)}</div>`});
}

/* ---------- dashboard ---------- */
async function dashboard(){
  const tok=navToken,p=$('page'),isAdmin=userMode==='admin';
  const t0=today(),m0=t0.slice(0,8)+'01';
  const who=isAdmin?'Admin':(currentDso?.full_name||'');
  const hr=new Date().getHours(),greet=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  const wd=new Date(t0+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long'});
  const row=(id,title)=>`<div class="dash-h">${title}</div><div class="cards cards5" id="${id}"></div>`;
  p.innerHTML=`<div class="hero"><div><div class="hero-h">${greet}, ${esc(who)}</div><div class="hero-s">${wd}, ${fmtDate(t0)} · ${isAdmin?'Distribution sales overview':'Your sales summary'}</div></div><div class="hero-a"><button onclick="go('sales')">＋ New sales entry</button><button class="ghost" onclick="go('reports')">Reports</button><button class="ghost" onclick="go('sheet')">Daily sales sheet</button></div></div>${row('todayStats','Today · '+fmtDate(t0))}${row('monthStats','This month · '+MON[Number(t0.slice(5,7))-1]+' '+t0.slice(0,4))}<div class="dgrid"><div class="panel"><h3>This month by brand</h3><div id="brandBars"><p class="muted">Loading…</p></div></div>${isAdmin?'<div class="panel"><h3>Top DSOs this month</h3><div id="dsoBars"><p class="muted">Loading…</p></div></div>':''}</div>${isAdmin?'<div class="chips" id="stats"></div>':''}`;
  const card=(k,v,cls,ic)=>`<div class="kcard ${cls||''}"><div class="ic">${ic||'•'}</div><div><div class="k">${k}</div><div class="v">${v}</div></div></div>`;
  const five=m=>card('Sales quantity',Number(m.qty).toLocaleString('en-US'),'','▣')+card('Sales amount',money(m.gross),'','Tk')+card('Trade promotion',money(m.tp),'kc-amber','％')+card('Collection amount',money(m.col),'kc-green','✓')+card('Due amount',money(m.due),'kc-red','!');
  $('todayStats').innerHTML=card('Loading…','…');$('monthStats').innerHTML=card('Loading…','…');
  try{
    if(isAdmin)Promise.all(['brands','roads','dsos','sales_entries'].map(count)).then(([b,r,d,s])=>{if(tok===navToken&&$('stats'))$('stats').innerHTML=[['Brands',b],['Roads',r],['DSOs',d],['Sales entries',s]].map(x=>`<span>${x[0]}<b>${x[1]}</b></span>`).join('')}).catch(()=>{});
    const rows=await fetchAll(()=>scopedReport().gte('sale_date',m0).lte('sale_date',t0).order('sale_date').order('id'));
    if(tok!==navToken)return;
    /* quantity comes from the product lines of the sales entries */
    const ids=rows.filter(x=>Number(x.item_count)!==0).map(x=>x.id),qtyBy={};
    for(let i=0;i<ids.length;i+=100){
      const part=ids.slice(i,i+100);
      const items=await fetchAll(()=>db.from('sales_items').select('sales_entry_id,quantity').in('sales_entry_id',part).order('sales_entry_id'));
      if(tok!==navToken)return;
      items.forEach(it=>{qtyBy[it.sales_entry_id]=(qtyBy[it.sales_entry_id]||0)+Number(it.quantity||0)});
    }
    /* collection includes due-collection entries; due amount is from sales only */
    const agg=list=>{const a={qty:0,gross:0,tp:0,col:0,due:0};list.forEach(x=>{a.col+=Number(x.received_amount||0);if(Number(x.item_count)!==0){a.qty+=qtyBy[x.id]||0;a.gross+=Number(x.total_sales||0);a.tp+=Number(x.trade_promotion_amount||0);a.due+=Number(x.outstanding||0)}});return a};
    $('todayStats').innerHTML=five(agg(rows.filter(x=>x.sale_date===t0)));
    $('monthStats').innerHTML=five(agg(rows));
    /* month ranking bars */
    const bars=(el,keyFn,nameFn,limit)=>{
      const g=[...groupBy(rows,keyFn).values()].map(l=>({name:nameFn(l[0]),a:agg(l)})).sort((x,y)=>y.a.gross-x.a.gross).slice(0,limit);
      const max=Math.max(1,...g.map(x=>x.a.gross));
      el.innerHTML=g.length&&g.some(x=>x.a.gross>0)?g.map(x=>`<div class="bar-row"><div>${nameFn===brandNm?brandTag(x.name,24):esc(x.name)}</div><div class="bar"><i style="width:${Math.max(2,x.a.gross/max*100).toFixed(1)}%"></i></div><div class="bar-v">${money(x.a.gross).replace(/\.00$/,'')}<small>${x.a.qty.toLocaleString('en-US')} pcs</small></div></div>`).join(''):'<p class="muted" style="margin:0">No sales yet this month.</p>';
    };

  const picture=async(btnEl,saveOnly)=>{

          }

  async function creditAction(b){

    if(a==='cedit'){
      let ts,curS,curR;
      if(b.dataset.k){const ps=SHOPPARTS[b.dataset.k];if(!ps)return;ts=ps.map(r=>({rid:r.rid,bid:r.bid,list:r.list||''}));curS=String(ps[0].c[0]||'');curR=[...new Set(ps.map(r=>r.dso))].filter(x=>x&&x!=='—').join(', ')}
      else{ts=[{rid:b.dataset.rid,bid:b.dataset.bid,list:b.dataset.list||''}];curS=b.dataset.shop||'';curR=b.dataset.dso==='—'?'':(b.dataset.dso||'')}

      const r1=prompt('Responsible person name. Changes only this credit report. Clear it to restore the original:',curR);if(r1===null)return;
      const sCh=s1.trim()!==curS,rCh=r1.trim()!==curR;

        else res=await db.from('credit_overrides').upsert({retailer_id:t.rid,brand_id:t.bid,list_name:t.list,shop_name,resp_name},{onConflict:'retailer_id,brand_id,list_name'});

      await run();return true;

      if(!confirm('Delete this cheque line permanently ('+ids.length+' cheque record'+(ids.length>1?'s':'')+' and all their recoveries)? This cannot be undone.'))return;

      if(!recs.length)return;

      const {data}=await db.from('cheque_recoveries').select('*').in('cheque_id',ids).order('created_at',{ascending:false}).order('id',{ascending:false}).limit(1);

      res=await db.from('cheque_recoveries').delete().in('id',rows.map(x=>x.id));

    }

    run();
  };

/* ---------- file import helpers (CSV / Excel) ---------- */
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0]||'';
  const delim=first.includes('\t')?'\t':(first.split(';').length>first.split(',').length?';':',');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows;
}
async function readSheetRows(file){
  const name=file.name.toLowerCase();
  if(file.size>5*1024*1024)throw new Error('File is too large (max 5 MB).');
  if(/\.(csv|tsv|txt)$/.test(name))return parseCsv(await file.text());
  if(/\.(xlsx|xls|xlsm)$/.test(name)){
    if(!window.XLSX)throw new Error('The Excel reader could not load (check your internet connection). Save the file as CSV and try again.');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    if(!ws)throw new Error('The Excel file has no sheets.');
    return XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
  }
  throw new Error('Please choose a .csv, .xlsx or .xls file.');
}

function manualGrid(o){
  const host=$(o.host);let n=0;
  const cell=(c,i)=>c.type==='select'
    ?`<select data-r="${i}" data-k="${c.k}">${c.opts.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join('')}</select>`
    :`<input data-r="${i}" data-k="${c.k}" ${c.type==='number'?'type="number" min="0" step="0.01"':''} placeholder="${esc(c.l)}">`;
  const rowHtml=i=>`<tr data-row="${i}"><td class="muted">${i+1}</td>${o.cols.map(c=>`<td>${cell(c,i)}</td>`).join('')}</tr>`;
  host.innerHTML=`<div class="panel" style="background:#f8fafd;margin:10px 0"><h3>${esc(o.title)}</h3><p class="muted" style="margin:0 0 8px;font-size:12px">${esc(o.hint)}</p><div class="table-wrap"><table class="items mgrid"><thead><tr><th>#</th>${o.cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}</tr></thead><tbody id="mgRows"></tbody></table></div><div class="form-actions"><button class="secondary" id="mgMore">＋ 5 more rows</button><button id="mgSave">${esc(o.saveLabel)}</button><button class="secondary" id="mgCancel">Cancel</button></div><div id="mgMsg"></div></div>`;
  const add=k=>{for(let j=0;j<k;j++){$('mgRows').insertAdjacentHTML('beforeend',rowHtml(n));
    if(n>0)o.cols.filter(c=>c.type==='select').forEach(c=>{const prev=$('mgRows').querySelector(`[data-r="${n-1}"][data-k="${c.k}"]`),cur=$('mgRows').querySelector(`[data-r="${n}"][data-k="${c.k}"]`);if(prev&&cur)cur.value=prev.value});
    else o.cols.filter(c=>c.type==='select'&&c.def).forEach(c=>{$('mgRows').querySelector(`[data-r="0"][data-k="${c.k}"]`).value=c.def});
    n++}};
  add(o.rows||6);
  $('mgMore').onclick=()=>add(5);
  $('mgCancel').onclick=()=>{host.innerHTML=''};
  $('mgSave').onclick=async()=>{
    const m=$('mgMsg'),recs=[];
    for(let i=0;i<n;i++){
      const r={};let typed=false;
      o.cols.forEach(c=>{const el=$('mgRows').querySelector(`[data-r="${i}"][data-k="${c.k}"]`);r[c.k]=el.value.trim();if(c.type!=='select'&&r[c.k]!=='')typed=true});
      if(typed)recs.push({i:i+1,r});
    }
    if(!recs.length)return msg(m,'Type at least one row.');
    const out=[],seen=new Set(),skipped=[];
    for(const x of recs){
      const e=o.check(x.r);
      if(e)return msg(m,'Row '+x.i+': '+e);
      const k=o.key(x.r);
      if(o.exists(k)||seen.has(k)){skipped.push(x.i);continue}
      seen.add(k);out.push(o.make(x.r));
    }
    if(!out.length)return msg(m,'Nothing new to save: every typed row already exists.');
    $('mgSave').disabled=true;
    const {error}=await db.from(o.table).insert(out);
    $('mgSave').disabled=false;
    if(error)return msg(m,error.message);
    await o.done();
    if(skipped.length)alert(out.length+' saved. Row '+skipped.join(', ')+' already existed and was skipped.');
  };
}

async function toggleRow(table,id,active){const {error}=await db.from(table).update({is_active:!active}).eq('id',id);if(error)alert(error.message);else await loadRows(table)}

async function deleteRow(table,id){
  const row=(window['_rows_'+table]||[]).find(x=>x.id===id)||{};
  const label=row.name||row.full_name||row.product_name||'this record';
  if(!confirm('Delete "'+label+'" permanently? This cannot be undone.\n\nIf it has been used in sales, use Deactivate instead.'))return;
  const {data,error}=await db.from(table).delete().eq('id',id).select('id');
  if(error){alert(error.code==='23503'?'Cannot delete "'+label+'" because it is used by other records (sales, DSOs, retailers or products). Use Deactivate instead.':error.message);return}
  if(!data||!data.length){alert('Nothing was deleted. You may not have permission to delete from this table (check the Supabase delete policy).');return}

}

    if(!head.sale_date||!head.brand_id||!head.road_id||!head.dso_id)return msg(m,'Please select date, brand, road and DSO.');
    if(!head.retailer_id)return msg(m,'Please select a retailer, or click + New retailer to add one.');
    if(!Number.isFinite(head.trade_promotion_amount)||!Number.isFinite(head.received_amount)||!Number.isFinite(cashAmt)||cashAmt<0||chqAmt<0||head.trade_promotion_amount<0||head.received_amount<0)return msg(m,'Check trade promotion, cash and cheque amounts.');
    if(chqAmt>0&&!collOnly&&!$('sChqDate').value)return msg(m,'Enter the cheque payable date.');
    const used=rows.filter(x=>x.product_id||x.quantity>0);
    if(!collOnly&&!used.length)return msg(m,'Select at least one product and enter its quantity.');
    if(!collOnly&&used.some(x=>!x.product_id||!Number.isInteger(x.quantity)||x.quantity<1||!Number.isFinite(x.unit_price)||x.unit_price<0))return msg(m,'Every product line needs a product, a whole-number quantity of at least 1 and a valid price.');
    const gross=collOnly?0:used.reduce((a,x)=>a+x.quantity*x.unit_price,0);
    if(head.trade_promotion_amount>gross)return msg(m,'Trade promotion cannot be more than gross sales.');
    if(collOnly&&!(head.received_amount>0))return msg(m,'Enter the collected amount.');
    if(!collOnly&&head.received_amount>gross-head.trade_promotion_amount&&!confirm('Received amount is more than net sales. Save anyway?'))return;
    /* warn when money is still due: nothing collected, or only part of the net sales */
    if(!collOnly){
      const net=gross-head.trade_promotion_amount,due=net-head.received_amount;
      if(due>0.009){
        const ask=head.received_amount<=0
          ?'No collection amount was entered.\n\nDo you want to keep the full '+money(net)+' as DUE?'
          :'Net sales '+money(net)+', received '+money(head.received_amount)+'.\n\n'+money(due)+' will stay as DUE. Do you want to keep it as due and save?';
        if(!confirm(ask))return;
      }
    }
    if(chqAmt>0||oldChq){const t=await db.from('cheques').select('id').limit(1);if(t.error)return msg(m,'Cheque tracking is not set up yet. Run cheque-setup.sql in Supabase, then try again. Nothing was saved.')}
    /* Due collection only: cheque money = RECOVERY of the retailer's open cheques (oldest first), not a new cheque */
    let recPlan=[];
    if(collOnly&&chqAmt>0&&!oldChq){
      btn.disabled=true;let open;try{open=await retailerChequeDue(head.retailer_id,head.sale_date)}catch(e){btn.disabled=false;return msg(m,'Could not read the cheque due: '+(e.message||e))}btn.disabled=false;
      const tot=open.reduce((a,x)=>a+x.left,0);
      if(chqAmt>tot+0.005)return msg(m,'Cheque recovery '+money(chqAmt)+' is more than this retailer\'s cheque due ('+money(tot)+'). Nothing was saved.');
      let rest=chqAmt;open.forEach(x=>{if(rest<=0.005)return;const take=Math.min(rest,x.left);recPlan.push({cheque_id:x.id,amount:Math.round(take*100)/100,recovered_on:head.sale_date});rest=Math.round((rest-take)*100)/100});
    }
    btn.disabled=true;
    try{
      await saveEntry(editing?editId:null,head,collOnly?[]:used.map(x=>({product_id:x.product_id,quantity:x.quantity,unit_price:x.unit_price})));
      if(recPlan.length){const re=await db.from('cheque_recoveries').insert(recPlan);if(re.error)throw new Error('The entry was saved but the cheque recovery was not: '+re.error.message+'. Record it from Credit & Cheque Report › Recovery.')}
      if((chqAmt>0&&!collOnly)||oldChq){
        let eid=editing?editId:null;
        if(!eid){const f=await db.from('sales_entries').select('id').eq('dso_id',head.dso_id).eq('retailer_id',head.retailer_id).eq('brand_id',head.brand_id).eq('sale_date',head.sale_date).order('id',{ascending:false}).limit(1);if(f.error||!f.data||!f.data[0])throw new Error('The entry was saved but the cheque could not be linked. Open today\'s entries, press Edit and add the cheque again.');eid=f.data[0].id}
        const cv={amount:chqAmt,payable_date:$('sChqDate').value||null};
        let ce=null;
        if(oldChq&&chqAmt>0)ce=(await db.from('cheques').update(cv).eq('id',oldChq.id)).error;
        else if(oldChq)ce=(await db.from('cheques').delete().eq('id',oldChq.id)).error;
        else ce=(await db.from('cheques').insert({...cv,sales_entry_id:eid})).error;
        if(ce)throw new Error('The entry was saved but the cheque was not: '+ce.message);
      }
      if(editing){go('reports');return}
      rows=[newRow()];$('sTp').value=0;$('sReceived').value=0;$('sCheque').value=0;$('sChqDate').value='';showChq();$('sNotes').value='';renderItems();
      msg(m,collOnly?'Collection saved successfully.':'Sales entry saved successfully.','success');loadToday();
    }catch(err){msg(m,err.message||String(err))}
    btn.disabled=false;
  };
}

}

const isDueRow=x=>Number(x.item_count)===0;

const myBrandIds=()=>(userMode==='dso'&&currentDso&&(currentDso.brandIds||[]).length)?currentDso.brandIds:null;
const onlyMyBrands=a=>{const m=myBrandIds();return m?a.filter(x=>m.includes(x.id)):a};
/* totals for a list of sales_report rows: collection-only rows add to Received only */
function aggRows(list){
  const a={n:0,qty:0,gross:0,tp:0,net:0,rec:0,out:0};
  list.forEach(x=>{
    a.rec+=Number(x.received_amount||0);
    if(isDueRow(x))return;
    a.n++;(rep.items[x.id]||[]).forEach(i=>{a.qty+=Number(i.quantity||0)});
    a.gross+=Number(x.total_sales||0);a.tp+=Number(x.trade_promotion_amount||0);a.net+=Number(x.net_sales||0);a.out+=Number(x.outstanding||0);
  });
  return a;
}

const FIT={avail:736,n:{a:403,b:29},d:{a:491,b:24}};
function fitSheets(){
  document.querySelectorAll('.sheet').forEach(sh=>{
    const n=sh.querySelectorAll('table.mx tbody tr').length;
    const m=sh.querySelector('table.mx.dense')?FIT.d:FIT.n,hh=m.a+m.b*n;
    /* 1px borders do not shrink with zoom, so keep them out of the scaled part */
    const k=n+15,sc=hh<=FIT.avail?1:(FIT.avail-k)/(hh-k);
    sh.style.setProperty('--fit',Math.max(0.5,Math.min(1,sc)).toFixed(3));
  });
}

  let p=LOC.pill;
  if(!txt){if(p){p.remove();LOC.pill=null}return}
  if(!p){p=document.createElement('div');p.className='noprint';p.style.cssText='position:fixed;left:10px;bottom:10px;z-index:50;max-width:80vw;padding:6px 12px;border-radius:99px;font:600 12px system-ui,sans-serif;box-shadow:0 2px 10px #0004';document.body.appendChild(p);LOC.pill=p}
  p.style.background=bad?'#fee2e2':'#dcfce7';p.style.color=bad?'#991b1b':'#166534';p.textContent=txt;
}
async function locSend(force){
  if(userMode!=='dso'||!currentDso||LOC.busy||document.hidden)return;
  if(!navigator.geolocation)return locPill('This phone/browser has no location support',true);
  if(!force&&Date.now()-LOC.last<LOC_EVERY-5000)return;
  LOC.busy=true;
  try{
    const p=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:25000,maximumAge:30000}));
    const r=await db.from('dso_locations').insert({dso_id:currentDso.id,lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),accuracy:Math.round(p.coords.accuracy||0)});
    if(r.error)locPill(/relation|schema cache|does not exist/i.test(r.error.message||'')?'Location not saved: ask Admin to run dso-location-setup.sql':'Location not saved: '+r.error.message,true);
    else{LOC.last=Date.now();locPill('📍 Location shared with Admin · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))}
  }catch(e){
    if(e&&e.code===1)locPill('Location is blocked. Allow location for this app so Admin can see your position.',true);
    else locPill('Could not get location (turn on GPS). Will retry.',true);
  }
  LOC.busy=false;
}
function stopLocTracking(){
  if(LOC.timer){clearInterval(LOC.timer);LOC.timer=null}
  if(LOC.vis){document.removeEventListener('visibilitychange',LOC.vis);LOC.vis=null}
  locPill('');
}
function startLocTracking(){
  stopLocTracking();LOC.last=0;
  LOC.timer=setInterval(()=>locSend(false),60000);
  LOC.vis=()=>{if(!document.hidden)locSend(false)};
  document.addEventListener('visibilitychange',LOC.vis);
  locSend(true);
}
/* Admin page: map with each DSO's latest position and the day's trail */
const loadLeaflet=()=>window.L?Promise.resolve():new Promise((ok,no)=>{
  const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(c);
  const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';sc.onload=ok;sc.onerror=()=>no(new Error('Could not load the map. Check the internet connection.'));document.head.appendChild(sc);
});
async function dsoLocPage(){
  const tok=navToken;
  if(userMode!=='admin'){$('page').innerHTML='<div class="notice error">Only Admin can see DSO locations.</div>';return}
  const dsos=await queryAll('dsos');if(tok!==navToken)return;
  const DN=Object.fromEntries(dsos.map(x=>[x.id,x.full_name]));
  const td=new Date(),ymd=td.getFullYear()+'-'+String(td.getMonth()+1).padStart(2,'0')+'-'+String(td.getDate()).padStart(2,'0');
  $('page').innerHTML=`<h1 class="page-title">DSO Location</h1><div class="sub">Position of each DSO while their app is open (updates about every 3 minutes). A DSO whose app is closed or phone is locked shows the last known position and time.</div><div class="panel"><div class="form-grid"><div><label>Date</label><input type="date" id="dlDate" value="${ymd}"></div><div><label>Show trail of</label><select id="dlDso"><option value="">— latest position of everyone —</option>${dsos.filter(x=>x.is_active!==false).sort((a,b)=>String(a.full_name).localeCompare(String(b.full_name))).map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select></div></div><div class="form-actions"><button id="dlRefresh">Refresh</button><button class="secondary" id="dlClean">Delete locations older than 30 days</button></div><div id="dlMsg"></div></div><div class="panel" style="margin-top:12px"><div id="dlMap" style="height:440px;border-radius:12px;overflow:hidden;background:#e5e7eb"></div></div><div class="panel" style="margin-top:12px"><div id="dlList"></div></div>`;
  try{await loadLeaflet()}catch(e){return msg($('dlMsg'),e.message)}
  if(tok!==navToken)return;
  const map=L.map('dlMap').setView([22.3,91.8],8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  let layer=L.layerGroup().addTo(map),first=true;
  const ago=t=>{const m=Math.max(0,Math.round((Date.now()-new Date(t))/60000));return m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' h '+(m%60)+' min ago':Math.floor(m/1440)+' day ago'};
  const hm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const color=t=>{const m=(Date.now()-new Date(t))/60000;return m<10?'#16a34a':m<60?'#f59e0b':'#6b7280'};
  const load=async(keepView)=>{
    const d=$('dlDate').value;if(!d)return;
    const a=new Date(d+'T00:00:00'),b=new Date(a.getTime()+864e5);
    let rows;
    try{rows=await fetchAll(()=>db.from('dso_locations').select('*').gte('recorded_at',a.toISOString()).lt('recorded_at',b.toISOString()).order('recorded_at',{ascending:false}).order('id',{ascending:false}))}
    catch(e){return msg($('dlMsg'),/relation|schema cache|does not exist/i.test(e.message||'')?'Location is not set up yet. Run dso-location-setup.sql in Supabase (SQL Editor), then reload.':(e.message||String(e)))}
    if(tok!==navToken||!$('dlMap'))return;
    $('dlMsg').innerHTML='';
    const sel=$('dlDso').value,last=new Map(),cnt={};
    rows.forEach(x=>{if(!last.has(x.dso_id))last.set(x.dso_id,x);cnt[x.dso_id]=(cnt[x.dso_id]||0)+1});
    layer.clearLayers();const pts=[];
    last.forEach((x,id)=>{
      if(sel&&id!==sel)return;
      const ll=[x.lat,x.lng];pts.push(ll);
      L.circleMarker(ll,{radius:9,color:'#fff',weight:2,fillColor:color(x.recorded_at),fillOpacity:1}).addTo(layer).bindTooltip(esc(DN[id]||'—'),{permanent:true,direction:'top',offset:[0,-8]}).bindPopup(`<b>${esc(DN[id]||'—')}</b><br>${hm(x.recorded_at)} · ${ago(x.recorded_at)}<br>Accuracy ~${x.accuracy||'?'} m`);
    });
    if(sel){
      const trail=rows.filter(x=>x.dso_id===sel).reverse().map(x=>[x.lat,x.lng]);
      if(trail.length>1)L.polyline(trail,{color:'#2563eb',weight:4,opacity:.8}).addTo(layer);
      trail.forEach((ll,i)=>{if(i<trail.length-1)L.circleMarker(ll,{radius:3,color:'#2563eb',weight:1,fillColor:'#fff',fillOpacity:1}).addTo(layer)});
    }
    if(pts.length&&(first||!keepView)){map.fitBounds(pts.length>1?pts:[pts[0],pts[0]],{padding:[40,40],maxZoom:16});first=false}
    const list=[...last.entries()].filter(([id])=>!sel||id===sel).sort((p,q)=>String(q[1].recorded_at).localeCompare(String(p[1].recorded_at)));
    const never=dsos.filter(x=>x.is_active!==false&&!last.has(x.id)&&!sel);
    $('dlList').innerHTML=`<div class="table-wrap"><table><thead><tr><th>DSO</th><th>Last seen</th><th>Accuracy</th><th>Points</th><th></th></tr></thead><tbody>${list.map(([id,x])=>`<tr><td><b>${esc(DN[id]||'—')}</b></td><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color(x.recorded_at)};margin-right:6px"></span>${hm(x.recorded_at)} · ${ago(x.recorded_at)}</td><td>${x.accuracy?'~'+x.accuracy+' m':''}</td><td>${cnt[id]}</td><td><button class="secondary" data-trail="${id}">Trail</button> <a href="https://www.google.com/maps?q=${x.lat},${x.lng}" target="_blank" rel="noopener">Google Maps</a></td></tr>`).join('')}${never.map(x=>`<tr><td>${esc(x.full_name)}</td><td colspan="4" class="muted">No location on this date</td></tr>`).join('')}</tbody></table></div>`;
  };
  $('dlRefresh').onclick=()=>{first=true;load(false)};
  $('dlDate').onchange=()=>{first=true;load(false)};
  $('dlDso').onchange=()=>{first=true;load(false)};
  $('dlList').onclick=e=>{const b=e.target.closest('button[data-trail]');if(!b)return;$('dlDso').value=b.dataset.trail;first=true;load(false)};
  $('dlClean').onclick=async()=>{
    if(!confirm('Delete every saved location older than 30 days?'))return;
    const c=new Date(Date.now()-30*864e5).toISOString();
    const r=await db.from('dso_locations').delete().lt('recorded_at',c).select('id');
    msg($('dlMsg'),r.error?r.error.message:'Deleted '+(r.data||[]).length+' old location points.',r.error?undefined:'success');
  };
  await load(false);
  const iv=setInterval(()=>{if(tok!==navToken||!$('dlMap')){clearInterval(iv);return}load(true)},60000);
}
try{buildBrandFloat()}catch(e){}
checkSession();
